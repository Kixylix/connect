name: Extension builder

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x86_64 - SourceMod 1.12
    runs-on: windows-2022

    env:
      PROJECT: connect
      SDKS: hl2sdk-tf2
      TARGET_ARCHS: x86_64
      MMSOURCE_VERSION: 1.12
      SOURCEMOD_VERSION: 1.12
      CACHE_PATH: ${{ github.workspace }}/cache

    steps:
      - name: Set SDK cache key
        shell: bash
        run: |
          set -euo pipefail

          SDKS_KEY="${SDKS//[[:blank:]]/}"
          echo "SDKS_KEY=${SDKS_KEY}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out extension
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: extension

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ runner.os }}-build-${{ env.PROJECT }}-sm${{ env.SOURCEMOD_VERSION }}-mm${{ env.MMSOURCE_VERSION }}-${{ env.SDKS }}-${{ env.TARGET_ARCHS }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.PROJECT }}-sm${{ env.SOURCEMOD_VERSION }}-mm${{ env.MMSOURCE_VERSION }}-${{ env.SDKS }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${CACHE_PATH}"
          cd "${CACHE_PATH}"

          shallow_checkout() {
              # Param 1: repository URL
              # Param 2: branch
              # Param 3: checkout directory
              if [[ ! -d "$3/.git" ]]; then
                  git clone \
                    --depth 1 \
                    --branch "$2" \
                    "$1" \
                    "$3"
              fi

              cd "$3"

              git submodule deinit --all --force || true
              git remote set-url origin "$1"
              git fetch --depth 1 origin "$2"
              git checkout --force --recurse-submodules FETCH_HEAD
              git submodule update --init --depth 1

              cd ..
          }

          git config --global advice.detachedHead false

          # Only the TF2 SDK is required.
          for sdk in ${SDKS}; do
              shallow_checkout \
                "https://github.com/alliedmodders/hl2sdk" \
                "${sdk}" \
                "hl2sdk-${sdk}"
          done

          shallow_checkout \
            "https://github.com/alliedmodders/ambuild" \
            "master" \
            "ambuild"

          shallow_checkout \
            "https://github.com/alliedmodders/sourcemod" \
            "${SOURCEMOD_VERSION}-dev" \
            "sourcemod"

          shallow_checkout \
            "https://github.com/alliedmodders/metamod-source" \
            "${MMSOURCE_VERSION}-dev" \
            "metamod-source"

          git config --global advice.detachedHead true

      - name: Build Windows 64-bit extension
        shell: bash
        working-directory: extension
        env:
          PLATFORM: Windows
          CC: msvc
          TARGET_ARCHS: ${{ env.TARGET_ARCHS }}
        run: |
          set -euo pipefail

          bash ./.github/workflows/build.sh

          if [[ ! -f build/includes/filename_versioning.txt ]]; then
              echo "ERROR: Build version file was not generated."
              exit 1
          fi

          if [[ ! -d build/package ]]; then
              echo "ERROR: Build package directory was not generated."
              exit 1
          fi

          FILENAME="$(cat build/includes/filename_versioning.txt)"
          ZIP_FILENAME="${PROJECT}-${FILENAME}-windows-x86_64.zip"

          echo "ZIP_FILENAME=${ZIP_FILENAME}" >> "${GITHUB_ENV}"

          echo "Build output:"
          find build/package -type f -print | sort

      - name: Package Windows release
        shell: pwsh
        working-directory: extension/build/package
        env:
          RELEASE_DIR: ${{ github.workspace }}/release
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:RELEASE_DIR | Out-Null

          $archivePath = Join-Path `
            $env:RELEASE_DIR `
            "${env:ZIP_FILENAME}"

          Compress-Archive `
            -Path * `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          Write-Host "Created archive:"
          Get-Item $archivePath

      - name: Upload Windows 64-bit build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-sm1.12
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
