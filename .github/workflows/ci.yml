name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x86_64 with SourceMod 1.12
    runs-on: windows-2022

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Checkout SourceMod 1.12
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: 1.12-dev
          path: sourcemod
          submodules: recursive

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Checkout sm-ext-common
        uses: actions/checkout@v4
        with:
          repository: srcdslab/sm-ext-common
          path: sourcemod/extensions/sm-ext-common

      - name: Install SourceMod dependencies
        shell: bash
        run: |
          set -euo pipefail

          bash sourcemod/tools/checkout-deps.sh \
            -m \
            -s sdk2013

      - name: Install AMBuild
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install ./ambuild

      - name: Build Windows 64-bit extension
        working-directory: extension
        shell: bash
        env:
          BREAKPAD_SYMBOL_SERVER: ${{ secrets.BREAKPAD_SYMBOL_SERVER }}
        run: |
          set -euo pipefail

          mkdir -p build
          cd build

          python ../configure.py \
            --enable-optimize \
            --targets=x86_64 \
            --sdks=sdk2013

          ambuild

      - name: Verify package
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="build/package"

          if [[ ! -d "${PACKAGE_DIR}" ]]; then
            echo "ERROR: Package directory was not created:"
            echo "  ${PACKAGE_DIR}"
            exit 1
          fi

          if [[ -z "$(find "${PACKAGE_DIR}" -type f -print -quit)" ]]; then
            echo "ERROR: Package directory is empty."
            exit 1
          fi

          echo "Generated package:"
          find "${PACKAGE_DIR}" -type f -print | sort

      - name: Create Windows release archive
        shell: pwsh
        env:
          PACKAGE_DIR: ${{ github.workspace }}\extension\build\package
          RELEASE_DIR: ${{ github.workspace }}\release
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:RELEASE_DIR | Out-Null

          $version = "${env:GITHUB_REF_NAME}"
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") {
            $version = "build-${env:GITHUB_RUN_NUMBER}"
          }

          $archiveName = "${{ github.event.repository.name }}-${version}-windows-x86_64-sm1.12.zip"
          $archivePath = Join-Path $env:RELEASE_DIR $archiveName

          Compress-Archive `
            -Path (Join-Path $env:PACKAGE_DIR "*") `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          Write-Host "Created release archive:"
          Get-Item $archivePath

      - name: Upload Windows 64-bit build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x86_64-sm1.12
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download Windows 64-bit artifact
        uses: actions/download-artifact@v4
        with:
          name: package-windows-x86_64-sm1.12
          path: release

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail
          find release -type f -print -exec ls -lh {} \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.zip
          generate_release_notes: true
