name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64 with SourceMod 1.12
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sourcemod-version: 1.12-dev
            target-archs: x86_64
            sdks: sdk2013

    steps:
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libjansson-dev \
            python3-pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Checkout SourceMod 1.12
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sourcemod-version }}
          path: sourcemod
          submodules: recursive

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Checkout sm-ext-common
        uses: actions/checkout@v4
        with:
          repository: srcdslab/sm-ext-common
          path: sourcemod/extensions/sm-ext-common

      - name: Install SourceMod dependencies
        shell: bash
        run: |
          set -euo pipefail

          bash sourcemod/tools/checkout-deps.sh \
            -m \
            -s "${{ matrix.sdks }}"

      - name: Install AMBuild
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install ./ambuild

      - name: Build 64-bit extension
        working-directory: extension
        shell: bash
        env:
          BREAKPAD_SYMBOL_SERVER: ${{ secrets.BREAKPAD_SYMBOL_SERVER }}
        run: |
          set -euo pipefail

          mkdir -p build
          cd build

          python ../configure.py \
            --enable-optimize \
            --targets="${{ matrix.target-archs }}" \
            --sdks="${{ matrix.sdks }}"

          ambuild

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="extension/build/package"

          if [[ ! -d "${PACKAGE_DIR}" ]]; then
            echo "ERROR: Package directory was not created:"
            echo "  ${PACKAGE_DIR}"
            exit 1
          fi

          if [[ -z "$(find "${PACKAGE_DIR}" -type f -print -quit)" ]]; then
            echo "ERROR: Package directory is empty."
            exit 1
          fi

          echo "Generated package:"
          find "${PACKAGE_DIR}" -type f -print | sort

      - name: Upload 64-bit build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x86_64-sm1.12
          path: extension/build/package
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download 64-bit build artifact
        uses: actions/download-artifact@v4
        with:
          name: package-linux-x86_64-sm1.12
          path: packaged-files

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="${{ github.event.repository.name }}-${VERSION}-linux-x86_64-sm1.12.tar.gz"

          if [[ -z "$(find packaged-files -type f -print -quit)" ]]; then
            echo "ERROR: No files were downloaded from the build artifact."
            exit 1
          fi

          tar \
            --create \
            --gzip \
            --file "${ARCHIVE}" \
            --directory packaged-files \
            .

          echo "Created release archive:"
          ls -lh "${ARCHIVE}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: "*.tar.gz"
          generate_release_notes: true
